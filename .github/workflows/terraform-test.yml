name: Terraform CI & Terratest (Bash Compatible)

on:
  push:
    branches:
      - main
      - develop
      - feature/mvp
  pull_request:

jobs:
  deploy:
    name: "${{ matrix.env }} Terraform + Tests"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - env: feature
            branch: feature/mvp
            tfvars: develop.tfvars
            ami_env: develop
          - env: develop
            branch: develop
            tfvars: develop.tfvars
            ami_env: develop
          - env: dev
            branch: main
            tfvars: develop.tfvars
            ami_env: develop
          - env: nonprod
            branch: main
            tfvars: nonprod.tfvars
            ami_env: nonprod

    if: startsWith(github.ref, 'refs/heads/') && github.ref == format('refs/heads/{0}', matrix.branch)

    environment: ${{ matrix.env }}

    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start LocalStack
        run: |
          docker-compose -f docker-compose.test.yml up -d
          # Wait for LocalStack to be ready
          timeout 120s bash -c 'until curl -f http://localhost:4566/_localstack/health; do sleep 2; done'

      - name: Prepare Lambda Deployment Package
        run: |
          # Create lambda deployment packages for all lambda modules
          find modules -name "lambda" -type d | while read lambda_dir; do
            if [[ -f "$lambda_dir/lambda_function.py" && ! -f "$lambda_dir/lambda_function.zip" ]]; then
              echo "Creating lambda package for $lambda_dir"
              cd "$lambda_dir"
              zip lambda_function.zip lambda_function.py
              cd - > /dev/null
            fi
          done
        shell: bash

      - name: Create CI Environment Files
        run: |
          # Create minimal .auto.tfvars files for CI
          mkdir -p environments
          cat > environments/develop.auto.tfvars << 'EOF'
          access_key = "test"
          secret_key = "test"
          ami_id = "ami-12345678"
          bucket_name = "test-dev-bucket"
          account_id = "123456789012"
          EOF
          
          cat > environments/nonprod.auto.tfvars << 'EOF'
          access_key = "test"
          secret_key = "test"
          ami_id = "ami-12345678"
          bucket_name = "test-nonprod-bucket"
          account_id = "123456789013"
          EOF
        shell: bash

      - name: Run Terraform Hygiene Script
        shell: pwsh
        run: ./scripts/lint_terraform.ps1

      - name: Register Mock AMI
        working-directory: ./scripts
        run: pwsh ./register_mock_ami.ps1 -Env ${{ matrix.ami_env }}

      - name: Run Go Tests
        run: go test ./test/go/... -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Python Tests
        run: python -m pytest test/python/ -v
        
      - name: Cleanup LocalStack
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v