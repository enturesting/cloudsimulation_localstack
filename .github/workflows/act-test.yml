name: ACT Compatible Terraform Test

on:
  push:
  pull_request:

jobs:
  local-test:
    name: Local Terraform + Terratest
    runs-on: ubuntu-latest

    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Fix Terraform Permissions
        run: |
          # Find terraform binary in more specific locations to avoid systemd directories
          TERRAFORM_PATH=$(which terraform || find /opt/hostedtoolcache -name terraform -type f 2>/dev/null | head -n 1)
          if [ -n "$TERRAFORM_PATH" ] && [ -f "$TERRAFORM_PATH" ]; then
            chmod +x "$TERRAFORM_PATH"
            echo "Fixed permissions for: $TERRAFORM_PATH"
          else
            echo "Terraform binary already has correct permissions or not found in expected locations"
          fi

      - name: Create CI Environment Files
        run: |
          # Create minimal .auto.tfvars files for CI
          mkdir -p environments
          cat > environments/develop.auto.tfvars << 'EOF'
          access_key = "test"
          secret_key = "test"
          ami_id = "ami-12345678"
          bucket_name = "test-dev-bucket"
          account_id = "123456789012"
          EOF
          
          cat > environments/nonprod.auto.tfvars << 'EOF'
          access_key = "test"
          secret_key = "test"
          ami_id = "ami-12345678"
          bucket_name = "test-nonprod-bucket"
          account_id = "123456789013"
          EOF
        shell: bash

      - name: Run Terraform Hygiene Script
        shell: pwsh
        run: ./scripts/lint_terraform.ps1

      - name: Prepare Lambda Deployment Package
        run: |
          # Create lambda deployment packages for all lambda modules
          find modules -name "lambda" -type d | while read lambda_dir; do
            if [[ -f "$lambda_dir/lambda_function.py" && ! -f "$lambda_dir/lambda_function.zip" ]]; then
              echo "Creating lambda package for $lambda_dir"
              cd "$lambda_dir"
              zip lambda_function.zip lambda_function.py
              cd - > /dev/null
            fi
          done
        shell: bash

      - name: Register Mock AMI (all environments)
        run: |
          # Make scripts executable
          chmod +x scripts/register_mock_ami.sh
          
          for ENV in develop nonprod; do
            echo "Registering AMI for $ENV"
            ./scripts/register_mock_ami.sh $ENV
          done
        shell: bash

      - name: Validate Long-Form Module Docs
        shell: pwsh
        run: |
          pwsh ./scripts/ci_docs_validate.ps1

      - name: Run Go Tests
        run: go test ./test/go/... -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Python Tests
        run: python -m pytest test/python/ -v