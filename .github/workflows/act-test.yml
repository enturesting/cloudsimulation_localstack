name: ACT Compatible Terraform Test

on:
  push:
  pull_request:

jobs:
  local-test:
    name: Local Terraform + Terratest
    runs-on: ubuntu-latest

    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Fix Terraform Permissions
        run: |
          # Find terraform binary in more specific locations to avoid systemd directories
          TERRAFORM_PATH=$(which terraform || find /opt/hostedtoolcache -name terraform -type f 2>/dev/null | head -n 1)
          if [ -n "$TERRAFORM_PATH" ] && [ -f "$TERRAFORM_PATH" ]; then
            chmod +x "$TERRAFORM_PATH"
            echo "Fixed permissions for: $TERRAFORM_PATH"
          else
            echo "Terraform binary already has correct permissions or not found in expected locations"
          fi

      - name: Start LocalStack
        run: |
          # Start LocalStack Community (more reliable in CI)
          docker run -d --name localstack-test \
            -p "4566:4566" \
            -e DEBUG=1 \
            -e SERVICES=s3,dynamodb,lambda,apigateway,ec2,iam,kms \
            -e START_WEB=0 \
            localstack/localstack
          
          echo "Waiting for LocalStack to start..."
          # Check if container is running
          if ! docker ps | grep -q localstack-test; then
            echo "LocalStack container failed to start"
            docker logs localstack-test
            exit 1
          fi
          
          # Wait for LocalStack to be ready with shorter intervals
          echo "Checking LocalStack health..."
          for i in {1..60}; do
            if curl -s http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "LocalStack is ready after $i seconds"
              curl -s http://localhost:4566/_localstack/health
              break
            fi
            if [ $i -eq 60 ]; then
              echo "LocalStack failed to start within 60 seconds"
              docker logs localstack-test
              exit 1
            fi
            echo "Attempt $i/60 - waiting 1 second..."
            sleep 1
          done
        shell: bash

      - name: Create CI Environment Files
        run: |
          # Create minimal .auto.tfvars files for CI
          mkdir -p environments
          cat > environments/develop.auto.tfvars << 'EOF'
          access_key = "test"
          secret_key = "test"
          ami_id = "ami-12345678"
          bucket_name = "test-dev-bucket"
          account_id = "123456789012"
          EOF
          
          cat > environments/nonprod.auto.tfvars << 'EOF'
          access_key = "test"
          secret_key = "test"
          ami_id = "ami-12345678"
          bucket_name = "test-nonprod-bucket"
          account_id = "123456789013"
          EOF
        shell: bash

      - name: Run Terraform Hygiene Script
        shell: pwsh
        run: |
          # Run basic terraform hygiene without full validation that requires LocalStack
          $TerraformDir = "environments"
          $ChdirFlag = "-chdir=$TerraformDir"
          
          Write-Host "Running Terraform CI hygiene checks..." -ForegroundColor Cyan
          
          # Format .tf files recursively
          Write-Host "Formatting Terraform code..." -ForegroundColor Yellow
          terraform $ChdirFlag fmt -recursive -check
          
          # Initialize (but don't validate since that requires LocalStack)
          Write-Host "Initializing Terraform..." -ForegroundColor Yellow
          terraform $ChdirFlag init
          
          # Show providers info
          Write-Host "Displaying Terraform providers..." -ForegroundColor Yellow
          terraform $ChdirFlag providers
          
          Write-Host "Terraform CI hygiene checks completed." -ForegroundColor Green

      - name: Prepare Lambda Deployment Package
        run: |
          # Create lambda deployment packages for all lambda modules that need them
          find modules -path "*/lambda/v*/lambda_function.py" | while read python_file; do
            lambda_dir="$(dirname "$python_file")"
            zip_file="$lambda_dir/lambda_function.zip"
            if [[ ! -f "$zip_file" ]]; then
              echo "Creating lambda package for $lambda_dir"
              cd "$lambda_dir"
              zip lambda_function.zip lambda_function.py
              cd - > /dev/null
            else
              echo "Lambda package already exists: $zip_file"
            fi
          done
        shell: bash

      - name: Register Mock AMI (all environments)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL_EC2: http://localhost:4566
        run: |
          # Make all bash scripts executable (belt and suspenders approach)
          find scripts -name "*.sh" -type f -exec chmod +x {} \;
          
          # Test LocalStack connectivity first
          if ! curl -s http://localhost:4566/_localstack/health >/dev/null 2>&1; then
            echo "⚠️ LocalStack is not responding, skipping AMI registration (CI will continue)"
            echo "This is expected in some CI environments - infrastructure validation can proceed"
            exit 0
          fi
          
          for ENV in develop nonprod; do
            echo "Registering AMI for $ENV"
            if ! ./scripts/register_mock_ami.sh $ENV; then
              echo "⚠️ AMI registration failed for $ENV, but continuing with CI pipeline"
            fi
          done
        shell: bash

      - name: Validate Long-Form Module Docs
        shell: pwsh
        run: |
          # Fix the path for CI environment
          cd scripts
          pwsh ./ci_docs_validate.ps1

      - name: Run Go Tests
        run: |
          # Initialize Go modules and download dependencies
          go mod tidy
          go mod download
          
          # Run Go tests
          go test ./test/go/... -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Python Tests
        run: python -m pytest test/python/ -v

      - name: Cleanup LocalStack
        if: always()
        run: docker rm -f localstack-test || true